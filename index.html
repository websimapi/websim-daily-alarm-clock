<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Alarm Clock</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="permission-overlay" class="permission-overlay">
    <div class="permission-container">
      <h2>Daily Alarm Clock</h2>
      <p>To ensure alarms work properly, please click the button below:</p>
      <button id="enable-audio" class="btn btn-primary">Enable Alarm Sound</button>
    </div>
  </div>

  <div id="main-app" class="container hidden">
    <h1>Daily Alarm Clock</h1>
    
    <div class="clock-container">
      <div id="current-time" class="current-time">00:00:00</div>
    </div>
    
    <div class="alarm-container">
      <h2>Set Daily Alarm</h2>
      <div class="time-picker">
        <input type="time" id="alarm-time" class="time-input">
        <button id="set-alarm" class="btn">Set Alarm</button>
      </div>
      
      <div id="alarm-status" class="alarm-status">
        No alarm set
      </div>
      
      <div id="alarm-controls" class="alarm-controls hidden">
        <button id="test-alarm" class="btn btn-secondary">Test Sound</button>
        <button id="clear-alarm" class="btn btn-danger">Clear Alarm</button>
      </div>
    </div>
  </div>
  
  <audio id="alarm-sound" src="/wakeup.wav" preload="auto"></audio>
  
  <script src="script.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
